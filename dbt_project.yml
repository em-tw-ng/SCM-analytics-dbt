name: 'supply_chain_analytics'
version: '1.0.0'
config-version: 2

# This project runs on dbt-duckdb by default so it's free and runnable with
# zero external accounts (see README for setup). It's written in vanilla
# dbt/SQL with no warehouse-specific syntax, so pointing it at a Snowflake
# profile instead is a one-file change (profiles.yml) — see README "Running
# on Snowflake instead".
profile: 'supply_chain_analytics'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  supply_chain_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
